<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendari d'Advent</title>
  <meta name="theme-color" content="#16261f">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="stylesheet" href="css/estil.css">
</head>
<body>
  <canvas id="neu" aria-hidden="true"></canvas>

  <header class="capcalera">
    <div>
      <h1>Calendari d'Advent</h1>
      <p class="subtitol" id="subtitol">Desembre 2026</p>
    </div>
    <nav class="botons" hidden id="botons">
      <button class="boto-rodo" id="obre-cartera" aria-label="Cartera de vals">
        🎟️<span class="insignia" id="insignia" hidden>0</span>
      </button>
      <button class="boto-rodo" id="musica" aria-label="Música" aria-pressed="false">🔇</button>
    </nav>
  </header>

  <main>
    <section id="bloqueig" class="targeta bloqueig" hidden>
      <div class="cadenat" aria-hidden="true">🔒</div>
      <h2>Abans d'obrir res...</h2>
      <p id="pregunta" class="pregunta"></p>
      <form id="form-bloqueig" autocomplete="off">
        <input id="resposta" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="La teva resposta" aria-label="Resposta" required>
        <button class="boto" type="submit">Obrir 🎄</button>
      </form>
      <p id="error-bloqueig" class="error" role="alert"></p>
    </section>

    <section id="calendari" hidden>
      <p id="missatge-avui" class="missatge-avui"></p>
      <div id="graella" class="graella"></div>
    </section>

    <p id="carregant" class="carregant">Embolicant regals... 🎀</p>
  </main>

  <dialog id="modal" class="modal">
    <div id="modal-contingut"></div>
    <form method="dialog"><button class="boto boto-secundari">Tancar</button></form>
  </dialog>

  <dialog id="cartera" class="modal">
    <h2>🎟️ La teva cartera de vals</h2>
    <div id="cartera-llista"></div>
    <form method="dialog"><button class="boto boto-secundari">Tancar</button></form>
  </dialog>

  <div id="aniversari" class="aniversari" hidden></div>
  <canvas id="confeti" aria-hidden="true"></canvas>
  <div id="avis" class="avis" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
